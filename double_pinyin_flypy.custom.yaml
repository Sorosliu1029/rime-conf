# double_pinyin_flypy.custom.yaml
#
# 補靪：雾凇拼音（rime-ice）小鹤双拼方案 + 万象语法模型
#
# 部署位置：
# ~/Library/Rime  (Mac OS)
#
# 於重新部署後生效
#
# 依赖：
#   - iDvel/rime-ice（提供 double_pinyin_flypy.schema.yaml 及 rime_ice 词库）
#   - wanxiang-lts-zh-hans.gram（https://github.com/amzxyz/RIME-LMDG/releases/tag/LTS）

patch:
  # 切换到本方案时默认西文（ascii_mode = 1）
  switches/@0/reset: 1

  # 万象语法模型，参数取自 rime-ice 的 others/recipes/grammar.recipe.yaml
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 6
    collocation_min_length: 3
    collocation_penalty: -14
    non_collocation_penalty: -6
    weak_collocation_penalty: -100
    rear_penalty: -20
  translator/contextual_suggestions: false
  translator/max_homophones: 8
